<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Shader Background Preview - Silk & Mesh Drift</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03120E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
    }
    #mesh-drift-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      display: block;
    }
    .overlay {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      pointer-events: none;
    }
    .card {
      pointer-events: auto;
      background: rgba(10, 20, 16, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .btn-light {
      background: #F4FFC7;
      color: #03120E;
    }
    .btn-dark {
      background: #0E7C5A;
      color: #FFFFFF;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body data-theme="light">
  <canvas id="mesh-drift-canvas"></canvas>

  <div class="overlay">
    <div class="card">
      <h1 id="title">Silk Flow Shader (Light Mode)</h1>
      <p id="desc">Active style: "Silk" harmonic flow shader (#03120E, #0E7C5A, #7CE577, #F4FFC7).</p>
      <div class="btn-group">
        <button class="btn-light" id="btn-light" onclick="setLight()">Light Mode (Silk)</button>
        <button class="btn-dark" id="btn-dark" onclick="setDark()">Dark Mode (Mesh Drift)</button>
      </div>
    </div>
  </div>

  <script src="mesh_drift.js"></script>
  <script>
    function setLight() {
      if (window.setShaderMode) window.setShaderMode('silk');
      document.body.setAttribute('data-theme', 'light');
      document.getElementById('title').innerText = 'Silk Flow Shader (Light Mode)';
      document.getElementById('desc').innerText = 'Active style: "Silk" harmonic flow shader (#03120E, #0E7C5A, #7CE577, #F4FFC7).';
    }
    function setDark() {
      if (window.setShaderMode) window.setShaderMode('mesh_drift');
      document.body.setAttribute('data-theme', 'dark');
      document.getElementById('title').innerText = 'Mesh Drift Shader (Dark Mode)';
      document.getElementById('desc').innerText = 'Active style: "Mesh Drift" blob shader (#03120E, #0E7C5A, #7CE577, #F4FFC7).';
    }
    window.addEventListener('load', () => {
      setLight();
    });
  </script>
</body>
</html>
